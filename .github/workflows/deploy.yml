name: Deploy to Cloudflare

# Auto-deploy the site to the Cloudflare Worker on every push to main that
# touches code (doc-only changes under research/ and *.md are ignored so a
# roadmap edit doesn't rebuild the whole site). Replaces the manual
# `nvm use 22 && npm run cf:build && npm run cf:deploy`.
#
# ONE-TIME SETUP (owner): add two repo secrets in
# Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN  — a token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID — d6d43b8e4c7d1d4858991c524843db4c
# Until the token is set, runs are a green no-op (they skip the deploy).

on:
  push:
    branches: [main]
    paths-ignore:
      - "research/**"
      - "**/*.md"
  workflow_dispatch: {}

concurrency:
  group: cf-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check for Cloudflare secret
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN not set — skipping deploy. Add CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID in Settings → Secrets and variables → Actions to enable auto-deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: npm ci

      - name: Build (OpenNext for Cloudflare)
        if: steps.check.outputs.skip != 'true'
        run: npx opennextjs-cloudflare build

      - name: Deploy to Cloudflare Workers
        if: steps.check.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy
