name: AdSense readiness

# Weekly check: has organic search traffic grown enough to (re)apply to AdSense?
# Runs the zero-dependency scripts/adsense-readiness.mjs against Search Console
# and, when the threshold is reached, opens ONE GitHub issue so you get an email.
#
# ── One-time setup ──────────────────────────────────────────────────────────
# 1. Google Cloud console → create/pick a project → enable "Google Search
#    Console API".
# 2. Create a Service Account → Keys → add key → JSON → download it.
# 3. Search Console → property costtrek.com → Settings → Users and permissions →
#    Add user → paste the service account's client_email → Restricted.
# 4. This repo → Settings → Secrets and variables → Actions → New repository
#    secret → name: GSC_SA_KEY, value: paste the ENTIRE JSON key file.
# Until the secret exists the job runs but no-ops (no issue, no failure emails).
# After AdSense is approved, disable this workflow (Actions tab → ⋯ → Disable).

on:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC
  workflow_dispatch: {} # manual run button

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: check
        env:
          GSC_SA_KEY: ${{ secrets.GSC_SA_KEY }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }} # optional; script defaults to https://costtrek.com/
        run: node scripts/adsense-readiness.mjs

      - name: Open an issue when ready
        if: steps.check.outputs.ready == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'adsense-readiness';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            if (existing.data.length > 0) {
              core.info('Readiness issue already open — not opening another.');
              return;
            }
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🟢 AdSense readiness: traffic threshold reached — time to apply',
              labels: [label],
              body: [
                'The weekly AdSense-readiness check says organic search traffic has',
                'reached our threshold. Consider (re)applying to AdSense now.',
                '',
                `See the numbers in the run summary: ${run}`,
                '',
                '_After you apply/are approved, disable the "AdSense readiness" workflow._',
              ].join('\n'),
            });
